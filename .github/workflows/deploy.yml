name: Deploy Panel to EC2 (Blue-Green)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets
        run: bun run prod

      - name: Determine active instance color
        id: color
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -f /opt/dstack-panel/.active_instance ] && grep -q '^green$' /opt/dstack-panel/.active_instance; then
              echo "active=green" >> $GITHUB_OUTPUT
              echo "next=blue" >> $GITHUB_OUTPUT
            else
              echo "active=blue" >> $GITHUB_OUTPUT
              echo "next=green" >> $GITHUB_OUTPUT
            fi

      - name: Sync code and assets to EC2
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: .
          remote_path: /opt/dstack-panel
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy new instance (blue-green)
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXT_COLOR: ${{ steps.color.outputs.next }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            NEXT_COLOR="$NEXT_COLOR"
            NEXT_PORT=5000
            if [ "$NEXT_COLOR" = "blue" ]; then
              NEXT_PORT=5001
            fi

            NEXT_SERVICE="dstack-panel@$NEXT_COLOR.service"

            # Ensure env file exists for the new instance
            if [ ! -f /opt/dstack-panel/.env.$NEXT_COLOR ]; then
              cp /opt/dstack-panel/.env /opt/dstack-panel/.env.$NEXT_COLOR
            fi

            # Start next instance
            systemctl daemon-reload
            systemctl enable --now "$NEXT_SERVICE"

            # Run migrations against the app
            cd /opt/dstack-panel
            php artisan migrate --force

            # Health-check
            HEALTH_URL="http://127.0.0.1:$NEXT_PORT/up"
            API_HEALTH_URL="http://127.0.0.1:$NEXT_PORT/api/health"

            for i in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1 && curl -fsS "$API_HEALTH_URL" >/dev/null 2>&1; then
                echo "Next instance $NEXT_COLOR healthy on port $NEXT_PORT"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health-check failed for $NEXT_COLOR"
                systemctl stop "$NEXT_SERVICE"
                exit 1
              fi
              sleep 2
            done

            # Point upstream to new instance first (nginx reload)
            nginx -t && systemctl reload nginx

            # Stop old instance gracefully
            ACTIVE_COLOR="${{ steps.color.outputs.active }}"
            OLD_SERVICE="dstack-panel@$ACTIVE_COLOR.service"
            if systemctl is-active --quiet "$OLD_SERVICE"; then
              systemctl stop "$OLD_SERVICE"
            fi

            # Update active color file
            echo "$NEXT_COLOR" > /opt/dstack-panel/.active_instance
