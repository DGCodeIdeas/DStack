name: Build and Release Panel Assets

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets
        run: bun run prod

      - name: Package assets
        run: tar -czf panel-assets.tar.gz public/assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: panel-assets.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Panel assets built from ${{ github.ref_name }}