# DStack Panel — PHP-FPM + nginx configuration
# Serves the Laravel panel directly via PHP-FPM instead of proxying to php artisan serve.

upstream dstack_fpm {
    server unix:/run/php/php8.2-fpm-dstack.sock;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name panel.chadadigital.com;
    return 301 https://$host$request_uri;
}

# HTTPS server — Laravel panel served via PHP-FPM
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.chadadigital.com;

    root /opt/dstack-panel/public;
    index index.php index.html;

    client_max_body_size 64M;

    ssl_certificate     /etc/letsencrypt/live/panel.chadadigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.chadadigital.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    charset utf-8;

    # Static assets — served directly by nginx, bypass PHP entirely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /favicon.ico { access_log off; log_not_found off; }
    location /robots.txt  { access_log off; log_not_found off; }
    location /well-known  { root /var/www/html; allow all; }

    # Laravel application routing — passed to PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing via FPM socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass dstack_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 3600;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|git|svn|htaccess|md|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
