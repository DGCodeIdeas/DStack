user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # HTTP/2 support (requires TLS listener with http2 on; in vhosts)
    # Include per-project / per-service vhosts
    include /etc/nginx/conf.d/*.conf;

    # Include mounted vhosts directory (bind-mounted from host)
    include /etc/nginx/vhosts/*.conf;

    # Default server block (welcome / health endpoint)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            # Simple welcome response for health checks / root access
            return 200 "DevStack Manager is running. Nginx is up.\n";
            add_header Content-Type text/plain;
        }

        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
