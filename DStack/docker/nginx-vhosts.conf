# DevStack virtual host template (str.format)
#
# This file is the on-disk copy of the template used by server/virtual_hosts.py.
# VirtualHostManager reads this file when present and falls back to a built-in
# constant otherwise, so the two should stay in sync.
#
# Placeholders consumed by Python's str.format():
#   {domain}          - the virtual host name (e.g. testapp.local)
#   {container_root}  - web root *inside* the nginx container (/var/www/projects/...)
#   {try_files}       - the location / try_files directive (framework specific)
#
# NOTE: literal nginx braces are escaped as {{ and }} so the file can be passed
# directly to str.format(). The rendered output contains normal single braces.
server {{
    listen 80;
    listen [::]:80;
    server_name {domain};

    root {container_root};
    index index.php index.html;

    location / {{
        {try_files}
    }}

    location ~ \.php$ {{
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }}

    # ---------------------------------------------------------------
    # SSL (Subtask 4): uncomment and provide certificates to enable HTTPS.
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/{domain}.crt;
    # ssl_certificate_key /etc/nginx/ssl/{domain}.key;
    # ---------------------------------------------------------------
}}
